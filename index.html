                "@type": "Question",
                "name": "How do I use ScreenExtend?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Run it on your PC, scan a QR code (or open the URL) on any other device, and enter the 6-digit session code. That device becomes an extended monitor."
                }
              },
              {
                "@type": "Question",
                "name": "Is my data secure?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Every session needs a one-time code to join, which you can regenerate anytime to lock out unknown devices, and the stream is encrypted."
                }
              },
              {
                "@type": "Question",
                "name": "What resolution and refresh rate can it do? Can it game?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Each device goes up to 200% scale and 500 Hz. Gaming works if your network keeps up; heavy high-refresh video needs a strong connection. HDR is coming in a future release."
                }
              },
              {
                "@type": "Question",
                "name": "How many devices can connect at once?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "As many as you like; each one gets its own virtual display. Performance drops as you add more."
                }
              },
              {
                "@type": "Question",
                "name": "How does offline mode work?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "In Settings, start the hosted network with a name and password. Join that Wi-Fi on the other device and open the URL on the dashboard, no router needed."
                }
              },
              {
                "@type": "Question",
                "name": "What data does ScreenExtend collect?",
                "acceptedAnswer": {
                  "@type": "Answer",
