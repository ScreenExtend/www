            "mainEntity": [
              {
                "@type": "Question",
                "name": "Which devices can I use as the second screen?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Anything with a modern web browser: an iPad or Android tablet, a phone, or another laptop. Nothing gets installed on it. ScreenExtend itself runs on your Windows PC or Mac."
                }
              },
              {
                "@type": "Question",
                "name": "How do I use ScreenExtend?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Run it on your computer, scan the QR code (or open the link) on the other device, and type the 6-digit code. That device becomes an extra monitor."
                }
              },
              {
                "@type": "Question",
                "name": "Is my data secure?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "The picture and sound are always encrypted. A device can only join with the session's 6-digit code, and you can make a new code any time to keep others out. The join page itself loads over plain HTTP on your own network unless you switch on the HTTPS version, which your browser may warn about because the app makes its own certificate."
                }
              },
              {
                "@type": "Question",
                "name": "What resolution and refresh rate can it do? Can it game?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Each device can go up to 200% scale, and you can set its refresh rate anywhere from 15 to 550 Hz. In our tests the computer sent about 150 frames a second; what you actually see depends on the other device and your Wi-Fi. Gaming works if your network keeps up. HDR is coming in a future release."
                }
              },
              {
                "@type": "Question",
                "name": "How many devices can connect at once?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Several. Each one gets its own display, and each one you add uses more of your computer. With NVIDIA graphics, up to 8 devices use the graphics chip; any more fall back to the processor."
                }
              },
              {
                "@type": "Question",
                "name": "How does offline mode work?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Open Settings and start the hosted network with a name and password. Join that Wi-Fi on the other device and open the link ScreenExtend shows. No router needed."
                }
              },
              {
                "@type": "Question",
                "name": "What data does ScreenExtend collect?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Your screen is never stored. When a device joins over the internet, our relay passes a hashed IP address and a rough region to your computer, and our server keeps short-lived service logs. The Privacy Policy has the details."
                }
              }
